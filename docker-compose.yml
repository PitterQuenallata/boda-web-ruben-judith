services:
  app:
    build:
      context: .
      dockerfile: boda-api/Dockerfile
    environment:
      DB_HOST: mysql
      DB_NAME: boda
      DB_USER: boda
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      CODIGO_PANEL: ${CODIGO_PANEL:-rubenyjudith2026}
    # Sin mapeo de puertos: en Dokploy el tráfico entra por Traefik con el
    # dominio configurado (puerto interno 3000). El 3000 del host lo usa Dokploy.
    expose:
      - "3000"
    volumes:
      - fotos:/app/uploads
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: boda
      MYSQL_USER: boda
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  fotos:
  mysql_data:
